<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --sunk:#E8ECE4; --ink:#1C2620; --muted:#5C685F; --line:#D9DFD5;
  --accent:#2C5B4B; --accent-ink:#FFFFFF; --accent-soft:#DCE9E2;
  --spr:#4F9150; --sum:#C98B12; --aut:#8A3F62; --win:#3F6489;
  --danger:#A3352B;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1B231F; --sunk:#232D28; --ink:#E5ECE7; --muted:#9BA8A0; --line:#2D3832;
    --accent:#86C2AA; --accent-ink:#0E1914; --accent-soft:#22362D;
    --spr:#7CC07A; --sum:#E8B54A; --aut:#D07FA6; --win:#86AEDA; --danger:#F08A7E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1B231F; --sunk:#232D28; --ink:#E5ECE7; --muted:#9BA8A0; --line:#2D3832;
  --accent:#86C2AA; --accent-ink:#0E1914; --accent-soft:#22362D;
  --spr:#7CC07A; --sum:#E8B54A; --aut:#D07FA6; --win:#86AEDA; --danger:#F08A7E;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.titlerow{display:flex;align-items:center;gap:12px}
.titlerow h1{font:400 1.6rem/1.1 var(--serif);margin:0;flex:1;letter-spacing:-.01em}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;font-size:1.1rem;flex:none}
.weekbar{display:flex;align-items:center;gap:8px;margin-top:10px}
.weekbar .label{flex:1;text-align:center;font-weight:600;line-height:1.25}
.weekbar .label small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.weekbar .icon-btn{width:36px;height:36px}
.today-link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:.8rem}

/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-weight:600;font-size:.82rem;position:relative}
nav.tabs button .ic{font-size:1.25rem;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:18px}
nav.tabs .badge:empty{display:none}

/* Search & filters */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px}
.sep{width:1px;background:var(--line);margin:4px 2px}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 4px;color:var(--muted);font-size:.88rem}
.listhead select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:.88rem}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.d-printemps{background:var(--spr)} .d-ete{background:var(--sum)} .d-automne{background:var(--aut)} .d-hiver{background:var(--win)}

/* Recipe rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.row-btn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:12px 2px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-name{font-weight:600;font-size:1.02rem}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.dots{display:inline-flex;gap:3px;align-items:center}
.pill{border-radius:6px;background:var(--sunk);padding:1px 7px;font-weight:500}
.pill-vege{color:var(--spr);font-weight:600}
.pill-carne{color:var(--aut);font-weight:600}
.pill-dessert{color:var(--sum);font-weight:600}
details.more{margin:4px 0 2px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;padding:6px 0;list-style-position:inside}
.badge-inline{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.75rem;text-align:center}
.chip-select{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.88rem;color:var(--accent);font-weight:600}
.select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.prep-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.prep-min{display:flex;align-items:center;gap:6px;font-weight:500}
.prep-min input{width:90px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.item .calc{display:block;font-size:.8rem;color:var(--muted)}
.item .detail{display:flex;flex-direction:column;gap:2px;margin-top:4px;padding:6px 8px;border-radius:8px;background:var(--sunk);font-size:.82rem;color:var(--ink)}
.item .info{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);font-size:.8rem;font-weight:700;padding:0}
.item .info[aria-expanded="true"]{background:var(--sunk);color:var(--accent)}
.row-last{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.row-last.old{color:var(--accent);font-weight:600}
.pick{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.15rem;font-weight:700;color:var(--muted);display:grid;place-items:center}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.picked .row-name{color:var(--accent)}
.row.done .row-name{text-decoration:line-through;text-decoration-thickness:1px;opacity:.6}
.mini{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.82rem;font-weight:600;color:var(--muted)}
.mini[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.rm{border:0;background:none;color:var(--muted);font-size:1.2rem;width:36px;height:36px;flex:none}

.summary{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.summary .pill{padding:4px 10px;font-size:.85rem}

.empty-state{text-align:center;padding:36px 12px;color:var(--muted)}
.empty-state p{margin:0 0 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.center{justify-content:center}
.fab{position:fixed;right:max(16px, calc(50% - 344px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* Shopping */
.shop-tools{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.shop-tools .count{flex:1;color:var(--muted);font-size:.9rem}
.item{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.item input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.item label{flex:1;min-width:0;cursor:pointer}
.item .nm{font-weight:600}
.item .qt{color:var(--accent);font-weight:600;margin-left:6px}
.item .src{display:block;font-size:.8rem;color:var(--muted)}
.item.checked .nm,.item.checked .qt{text-decoration:line-through;opacity:.55}
.item .rm{height:auto}
.addline{display:flex;gap:8px;margin:14px 0 4px}
.addline input{flex:1}
h2.sub{font:400 1.15rem/1.2 var(--serif);margin:22px 0 4px}

/* Sheet */
dialog.sheet{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(720px,100%);max-width:100%;max-height:92vh;max-height:92dvh;margin:auto auto 0;border-radius:18px 18px 0 0;overflow:hidden}
@media (min-width:760px){dialog.sheet{margin:auto;border-radius:18px;max-height:86vh}}
dialog.sheet::backdrop{background:rgba(10,16,13,.45)}
.sheet-in{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font:400 1.35rem/1.2 var(--serif);margin:0;flex:1;overflow-wrap:break-word}
.sheet-body{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet-foot .grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > span,.field legend{font-weight:600;font-size:.9rem}
fieldset.field{border:0;padding:0;margin:0 0 16px}
.field input[type=text],.field input[type=date],.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.field .hint{font-size:.8rem;color:var(--muted)}
h3.lbl{font:600 .95rem var(--sans);margin:0}
.ing{margin:6px 0 16px;padding-left:20px}
.ing li{margin:3px 0}
.steps{white-space:pre-wrap;margin:6px 0 16px}
.kv{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.net{background:var(--sunk);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:0 0 12px}
body.locked nav.tabs,body.locked .fab,body.locked #weekbar,body.locked [data-action="data"]{display:none!important}
.gate{max-width:420px;margin:56px auto 0;text-align:center}
.gate h2{font:400 1.5rem/1.2 var(--serif);margin:0 0 10px}
.gate p{color:var(--muted);margin:0 0 20px}
.gate .gate-alert{background:var(--sunk);color:var(--danger);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <h1 id="title">Mes recettes</h1>
      <button class="icon-btn" data-action="data" aria-label="Mes données (sauvegarde, import)">⋯</button>
    </div>
    <div class="weekbar" id="weekbar"></div>
  </header>
  <p class="net" id="net" hidden>Hors ligne : tes modifications seront envoyées au retour du réseau.</p>
  <main id="main"><p class="empty-state">Chargement de tes recettes…</p></main>
</div>
<button class="fab" id="fab" data-action="new" hidden>+ Recette</button>
<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="recettes"><span class="ic" aria-hidden="true">📖</span>Recettes</button>
    <button data-tab="semaine"><span class="ic" aria-hidden="true">🥘</span>Ma semaine<span class="badge" id="badge"></span></button>

  </div>
</nav>
<dialog class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const plural = (n, s, p = s + 's') => `${n} ${n > 1 ? p : s}`;

const SEASONS = [
  { k: 'printemps', l: 'Printemps' }, { k: 'ete', l: 'Été' },
  { k: 'automne', l: 'Automne' }, { k: 'hiver', l: 'Hiver' }
];
const MOMENTS = [{ k: 'midi', l: 'Midi' }, { k: 'soir', l: 'Soir' }];
const REGIMES = [{ k: 'vege', l: 'Végé' }, { k: 'carne', l: 'Carné' }, { k: 'dessert', l: 'Dessert' }];
const CUISSONS = [{ k: 'cru', l: 'Cru' }, { k: 'four', l: 'Four' }, { k: 'poele', l: 'Poêle' }, { k: 'casserole', l: 'Casserole' }];
const CUISSON_KEYS = CUISSONS.map(c => c.k);
/* Catégories proposées d’office ; celles créées dans une recette s’y ajoutent automatiquement. */
const DEFAULT_CATEGORIES = ['Curry', 'Gâteau', 'Gratin', 'Mijoté', 'Pâtes', 'Poêlée', 'Riz', 'Rôti', 'Salade', 'Soupe', 'Tarte salée', 'Tarte sucrée'];
/* Régime d’une recette ; les anciennes recettes « avec/sans protéines » sont lues comme carné/végé. */
const regimeOf = r => ['vege', 'carne', 'dessert'].includes(r.regime) ? r.regime : r.protein === true ? 'carne' : r.protein === false ? 'vege' : null;
const regimeLabel = k => (REGIMES.find(x => x.k === k) || {}).l || '';
const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const seasonOf = d => { const m = d.getMonth(); return m >= 2 && m <= 4 ? 'printemps' : m >= 5 && m <= 7 ? 'ete' : m >= 8 && m <= 10 ? 'automne' : 'hiver'; };
const todayIso = () => iso(new Date());
const fmtDay = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const thisWeekKey = () => iso(mondayOf(new Date()));

/* ---------- state ---------- */
/* Version du format des données. Si le format change un jour, on incrémente ce numéro
   et on ajoute l’étape de conversion dans normRecipe / normWeek (voir LISEZMOI). */
const SCHEMA = 2;
const S = {
  tab: 'recettes', mode: 'loading', user: null, deniedEmail: '', errorMsg: '',
  recipes: new Map(), weeks: {}, weekKey: thisWeekKey(),
  moreOpen: false, openItems: new Set(), expired: false,
  filters: { q: '', seasons: new Set([seasonOf(new Date())]), moments: new Set(), regimes: new Set(), cuissons: new Set(), categories: new Set(), sort: 'oubli' }
};
const ready = () => S.mode === 'local' || S.mode === 'firebase';
const LKEY = 'mes-recettes:v1';
const LKEY_DONE = 'mes-recettes:transfere';
const FB_VERSION = '10.12.2';
const FB_BASE = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
const FB = { auth: null, db: null, authM: null, fs: null, unsub: [], unsubWeek: null };

/* ---------- format des données ---------- */
/* Une modification s’exprime comme un « patch » : seuls les champs cités changent,
   les autres (y compris ceux ajoutés par une future version de l’appli) sont conservés. */
const DEL = Object.freeze({ __op: 'del' });
const union = (...vals) => ({ __op: 'union', vals });
const removeVals = (...vals) => ({ __op: 'remove', vals });
const isPlain = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const opOf = v => isPlain(v) && typeof v.__op === 'string' ? v.__op : null;
function applyPatch(target, patch) {
  const out = isPlain(target) ? { ...target } : {};
  for (const [k, v] of Object.entries(patch)) {
    if (v === undefined) continue;
    const op = opOf(v);
    if (op === 'del') delete out[k];
    else if (op === 'union') { const cur = Array.isArray(out[k]) ? out[k] : []; out[k] = [...cur, ...v.vals.filter(x => !cur.includes(x))]; }
    else if (op === 'remove') out[k] = (Array.isArray(out[k]) ? out[k] : []).filter(x => !v.vals.includes(x));
    else if (isPlain(v)) out[k] = applyPatch(out[k], v);
    else out[k] = Array.isArray(v) ? v.slice() : v;
  }
  return out;
}
/* Traduit un patch en écriture Firestore (fusion). Les objets vides sont ignorés :
   avec une fusion, ils écraseraient le contenu existant. */
function toFs(patch) {
  const F = FB.fs, out = {};
  for (const [k, v] of Object.entries(patch)) {
    if (v === undefined) continue;
    const op = opOf(v);
    if (op === 'del') out[k] = F.deleteField();
    else if (op === 'union') { if (v.vals.length) out[k] = F.arrayUnion(...v.vals); }
    else if (op === 'remove') { if (v.vals.length) out[k] = F.arrayRemove(...v.vals); }
    else if (isPlain(v)) { const sub = toFs(v); if (Object.keys(sub).length) out[k] = sub; }
    else out[k] = v;
  }
  return out;
}
const SEASON_KEYS = SEASONS.map(s => s.k), MOMENT_KEYS = MOMENTS.map(m => m.k);
const strArr = a => Array.isArray(a) ? a.filter(x => typeof x === 'string') : [];
/* Lit une recette quel que soit son format et la ramène au format actuel.
   v1 : champ « protein » (true/false) au lieu de « regime ». */
function normRecipe(raw, id) {
  const r = isPlain(raw) ? { ...raw } : {};
  const regime = regimeOf(r);
  delete r.protein; delete r.id;
  const prep = Math.round(Number(r.prepMinutes));
  return {
    ...r, id,
    name: String(r.name || 'Sans nom'),
    seasons: strArr(r.seasons).filter(s => SEASON_KEYS.includes(s)),
    moments: strArr(r.moments).filter(m => MOMENT_KEYS.includes(m)),
    regime: regime || null,
    category: typeof r.category === 'string' && r.category.trim() ? r.category.trim() : null,
    cuissons: strArr(r.cuissons).filter(c => CUISSON_KEYS.includes(c)),
    prepMinutes: prep > 0 && prep < 10000 ? prep : null,
    veille: r.veille === true,
    ingredients: String(r.ingredients || ''),

    updated: Number(r.updated) || 0,
    v: SCHEMA
  };
}
const emptyWeek = () => ({ v: SCHEMA, picks: [], done: {}, mult: {}, checked: {}, extras: {} });
/* Lit une semaine quel que soit son format.
   v1 : planning par jour (« slots »), articles en plus dans un tableau, clés de courses « nom|unité ». */
function normWeek(raw, key) {
  const w = isPlain(raw) ? raw : {};
  const picks = strArr(w.picks);
  const done = {};
  if (isPlain(w.done)) for (const [k, d] of Object.entries(w.done)) if (typeof d === 'string') done[k] = d;
  if (isPlain(w.slots)) Object.values(w.slots).forEach(s => {
    if (s && typeof s.id === 'string') { if (!picks.includes(s.id)) picks.push(s.id); if (s.done && !done[s.id]) done[s.id] = key; }
  });
  const mult = {};
  if (isPlain(w.mult)) for (const [k, m] of Object.entries(w.mult)) if (m === 2) mult[k] = 2;
  const checked = {};
  if (isPlain(w.checked)) for (const [k, v] of Object.entries(w.checked)) if (v === true && /^[a-z0-9_]+$/.test(k)) checked[k] = true;
  const extras = {};
  if (Array.isArray(w.extras)) w.extras.forEach((e, i) => { if (e && e.t) extras[/^[a-z0-9]+$/.test(e.id || '') ? e.id : newId()] = { t: String(e.t), done: !!e.done, at: i }; });
  else if (isPlain(w.extras)) for (const [k, e] of Object.entries(w.extras)) if (isPlain(e) && e.t) extras[k] = { t: String(e.t), done: !!e.done, at: Number(e.at) || 0 };
  return { ...w, slots: undefined, v: SCHEMA, picks: [...new Set(picks)], done, mult, checked, extras };
}
function week(key = S.weekKey) { return S.weeks[key] || emptyWeek(); }

/* ---------- API de données unique (local ou Firebase) ----------

   hors ligne de Firestore et la synchro corrige l’affichage si besoin. */
function patchRecipe(id, patch) {

async function initFirebase(cfg) {
  try {
    const [appM, authM, fs] = await Promise.all([
      import(FB_BASE + 'firebase-app.js'),
      import(FB_BASE + 'firebase-auth.js'),
      import(FB_BASE + 'firebase-firestore.js')
    ]);
    FB.authM = authM; FB.fs = fs;
    const app = appM.initializeApp(cfg);
    // Session gardée dans le stockage du téléphone (IndexedDB, sinon localStorage).
    FB.auth = authM.initializeAuth(app, {
      persistence: [authM.indexedDBLocalPersistence, authM.browserLocalPersistence],
      popupRedirectResolver: authM.browserPopupRedirectResolver
    });
    try {
      FB.db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
    } catch (e) {
      console.warn('Cache hors ligne indisponible, synchro sans copie locale', e);
      FB.db = fs.getFirestore(app);
    }
  } catch (e) {
    console.error(e);
    S.mode = 'error';
    S.errorMsg = 'Impossible de charger Firebase. Le tout premier lancement demande une connexion internet : vérifie-la puis réessaie.';
    render(); return;
  }
  FB.authM.getRedirectResult(FB.auth).catch(authError);
  FB.authM.onAuthStateChanged(FB.auth, user => {
    if (user && sessionTooOld(user)) {
      S.expired = true; S.mode = 'login'; render();
      FB.authM.signOut(FB.auth).catch(() => {});
      return;
    }
    if (user) { S.expired = false; startSync(user); }
    else { stopSync(); if (S.mode !== 'denied') S.mode = 'login'; render(); }
  });
}
/* Une connexion Google réussie reste valable SESSION_MAX_DAYS jours, puis on redemande de se connecter.
   La date vient de Firebase (dernière connexion interactive), pas du téléphone. */
const SESSION_MAX_DAYS = 120;
function sessionTooOld(user) {
  const t = Date.parse(user && user.metadata && user.metadata.lastSignInTime);
  return Number.isFinite(t) && Date.now() - t > SESSION_MAX_DAYS * 864e5;
}
function startSync(user) {
  stopSync();
  const since = Date.parse(user.metadata && user.metadata.lastSignInTime);
  S.user = { email: user.email || '', since: Number.isFinite(since) ? since : null };
  S.mode = 'firebase';
  FB.unsub.push(FB.fs.onSnapshot(FB.fs.collection(FB.db, 'recettes'), snap => {
    const m = new Map();
    snap.docs.forEach(d => m.set(d.id, normRecipe(d.data(), d.id)));
    S.recipes = m; refresh();
    if (S.tab === 'recettes') bilanSemaines();
  }, onSyncError));
  subscribeWeek();
  render();
}
function subscribeWeek() {
  if (S.mode !== 'firebase') return;
  if (FB.unsubWeek) FB.unsubWeek();
  const key = S.weekKey;
  FB.unsubWeek = FB.fs.onSnapshot(FB.fs.doc(FB.db, 'semaines', key), snap => {
    S.weeks[key] = snap.exists() ? normWeek(snap.data(), key) : emptyWeek();
    if (key === S.weekKey) refresh();
  }, onSyncError);
}
function stopSync() {
  FB.unsub.forEach(u => u()); FB.unsub = [];
  if (FB.unsubWeek) { FB.unsubWeek(); FB.unsubWeek = null; }
  S.recipes = new Map(); S.weeks = {}; S.user = null; prevLoaded = {};
}
function onSyncError(e) {
  console.error(e);
  if (e && e.code === 'permission-denied') denied();
  else toast(`Synchronisation interrompue (${(e && e.code) || 'erreur'})`);
}
/* Compte connecté mais refusé par les règles Firestore : on vide l’écran et on déconnecte. */
function denied() {
  if (S.mode === 'denied') return;
  S.deniedEmail = S.user ? S.user.email : '';
  stopSync(); S.mode = 'denied'; closeSheet(); render();
  FB.authM.signOut(FB.auth).catch(() => {});
}
async function signIn() {
  const provider = new FB.authM.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await FB.authM.signInWithPopup(FB.auth, provider);
  } catch (e) {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
      try { await FB.authM.signInWithRedirect(FB.auth, provider); } catch (e2) { authError(e2); }
    } else authError(e);
  }
}
function authError(e) {
  if (!e || !e.code || e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
  console.error(e);
  const msg = {
    'auth/network-request-failed': 'Pas de connexion internet : la première connexion demande du réseau.',
    'auth/unauthorized-domain': 'Ce site n’est pas dans les domaines autorisés de Firebase (étape 3 du tutoriel).'
  }[e.code];
  toast(msg || `Connexion impossible (${e.code})`);
}
function signOutNow() { closeSheet(); FB.authM.signOut(FB.auth).catch(authError); }

/* ---------- recipes logic ---------- */
const lastMade = r => (r.history && r.history.length) ? r.history.slice().sort().at(-1) : null;
const daysSince = d => Math.round((parseIso(todayIso()) - parseIso(d)) / 864e5);
function lastLabel(r) {
  const l = lastMade(r);
  if (!l) return 'jamais faite';
  const n = daysSince(l);
  if (n <= 0) return 'aujourd’hui';
  if (n === 1) return 'hier';
  if (n < 14) return `il y a ${n} jours`;
  if (n < 60) return `il y a ${Math.round(n / 7)} sem.`;
  if (n < 365) return `il y a ${Math.round(n / 30)} mois`;
  return 'il y a plus d’un an';
}
const isOld = r => { const l = lastMade(r); return !l || daysSince(l) >= 30; };
const isPicked = id => week().picks.includes(id);

function filterRecipes(f) {
  const words = norm(f.q).split(/\s+/).filter(Boolean);
  let list = [...S.recipes.values()].filter(r => {
    if (f.seasons.size && r.seasons.length && !r.seasons.some(s => f.seasons.has(s))) return false;
    if (f.moments.size && r.moments.length && !r.moments.some(m => f.moments.has(m))) return false;
    if (f.regimes.size && !f.regimes.has(regimeOf(r))) return false;
    if (f.cuissons.size && !r.cuissons.some(c => f.cuissons.has(c))) return false;
    if (f.categories.size && !(r.category && f.categories.has(norm(r.category)))) return false;
    if (words.length) {
      const hay = norm([r.name, r.ingredients, r.tags.join(' '), r.notes, r.category || ''].join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const byName = (a, b) => a.name.localeCompare(b.name, 'fr');
  if (f.sort === 'az') list.sort(byName);
  else if (f.sort === 'za') list.sort((a, b) => byName(b, a));
  else if (f.sort === 'recent') list.sort((a, b) => (lastMade(b) || '').localeCompare(lastMade(a) || '') || byName(a, b));
  else list.sort((a, b) => (lastMade(a) || '').localeCompare(lastMade(b) || '') || byName(a, b));
  return list;
}

const fmtMinutes = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + pad(m % 60) : ''}`;

/* ---------- shopping logic ---------- */
const UNIT_MAP = {
  kg: 'g', g: 'g', mg: 'mg', l: 'ml', cl: 'ml', dl: 'ml', ml: 'ml',
  'c. à soupe': 'c. à s.', 'c. à s.': 'c. à s.', 'c.à.s': 'c. à s.', 'càs': 'c. à s.', cs: 'c. à s.', 'cuillère à soupe': 'c. à s.', 'cuillères à soupe': 'c. à s.',
  'c. à café': 'c. à c.', 'c. à c.': 'c. à c.', 'c.à.c': 'c. à c.', 'càc': 'c. à c.', cc: 'c. à c.', 'cuillère à café': 'c. à c.', 'cuillères à café': 'c. à c.',
  pincée: 'pincée', pincées: 'pincée', gousse: 'gousse', gousses: 'gousse', tranche: 'tranche', tranches: 'tranche',
  'boîte': 'boîte', 'boîtes': 'boîte', sachet: 'sachet', sachets: 'sachet', botte: 'botte', bottes: 'botte',
  brin: 'brin', brins: 'brin', pot: 'pot', pots: 'pot', verre: 'verre', verres: 'verre', tasse: 'tasse', tasses: 'tasse'
};
const FACTOR = { kg: 1000, l: 1000, cl: 10, dl: 100 };
const unitAlt = Object.keys(UNIT_MAP).sort((a, b) => b.length - a.length).map(u => u.replace(/[.]/g, '\\.')).join('|');
const LINE_RE = new RegExp(`^(\\d+(?:[.,]\\d+)?(?:\\s*/\\s*\\d+)?)\\s*(?:(${unitAlt})(?=\\s|$))?\\s*(?:de\\s+|d[’']\\s*)?(.*)$`, 'i');
function parseQty(s) {
  s = s.replace(',', '.').replace(/\s/g, '');
  if (s.includes('/')) { const [a, b] = s.split('/').map(Number); return b ? a / b : a; }
  return Number(s);
}
const nameKey = n => norm(n).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean).map(w => w.length > 3 ? w.replace(/[sx]$/, '') : w).join(' ');
/* Clé d’un article de courses : uniquement [a-z0-9_] pour servir de nom de champ Firestore. */
function shopKey(p) {
  const n = nameKey(p.name).replace(/ /g, '_') || 'article';
  const u = p.qty == null ? 'x' : (norm(p.unit).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'u');
  return `${n}__${u}`;
}
function parseLine(line) {
  const t = line.replace(/^[-•*]\s*/, '').trim();
  if (!t) return null;
  const m = t.match(LINE_RE);
  if (m && m[3]) {
    const raw = (m[2] || '').toLowerCase();
    let qty = parseQty(m[1]);
    if (FACTOR[raw]) qty *= FACTOR[raw];
    return { qty, unit: raw ? UNIT_MAP[raw] : '', name: m[3].trim() };
  }
  return { qty: null, unit: '', name: t };
}
function fmtQty(q, unit) {
  if (q == null) return '';
  let u = unit;
  if (u === 'g' && q >= 1000) { q /= 1000; u = 'kg'; }
  if (u === 'ml' && q >= 1000) { q /= 1000; u = 'l'; }
  const n = Math.round(q * 100) / 100;
  const s = String(n).replace('.', ',');
  if (!u) return s;
  const pl = n > 1 && !['g', 'kg', 'mg', 'ml', 'l', 'c. à s.', 'c. à c.'].includes(u) ? u + 's' : u;
  return `${s} ${pl}`;
}
function shoppingList() {
  const w = week(), map = new Map();
  w.picks.forEach(id => {
    const r = S.recipes.get(id); if (!r) return;
    const m = w.mult[id] === 2 ? 2 : 1;
    r.ingredients.split('\n').forEach(line => {
      const p = parseLine(line); if (!p) return;
      const key = shopKey(p);
      let it = map.get(key);
      if (!it) { it = { key, name: p.name, unit: p.unit, qty: p.qty == null ? null : 0, parts: [] }; map.set(key, it); }
      const q = p.qty == null ? null : p.qty * m;
      if (q != null && it.qty != null) it.qty += q;
      it.parts.push({ recipe: r.name, qty: q, mult: m });
    });
  });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'fr'));
}

async function allWeeks() {
  if (S.mode !== 'firebase') return S.weeks;
  try {
    const snap = await FB.fs.getDocs(FB.fs.collection(FB.db, 'semaines'));
    return Object.fromEntries(snap.docs.map(d => [d.id, normWeek(d.data(), d.id)]));
  } catch (e) { return S.weeks; }
}
async function doExport() {
  const data = JSON.stringify(clean({ app: 'mes-recettes', schema: SCHEMA, exported: new Date().toISOString(),
    recipes: [...S.recipes.values()], weeks: await allWeeks() }), null, 2);
  const filename = `mes-recettes-${todayIso()}.json`;
  try {
    const file = new File([data], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { if (e && e.name !== 'AbortError') toast('Export impossible ici'); }
}
/* Importe un export JSON (ou les données locales du téléphone), quel que soit son format. */
function importData(d) {
  const list = Array.isArray(d.recipes) ? d.recipes
    : Object.entries(isPlain(d.recipes) ? d.recipes : {}).map(([id, r]) => ({ ...r, id: (r && r.id) || id }));
  const recipes = list.filter(r => isPlain(r) && typeof r.name === 'string')
    .map(r => normRecipe(r, typeof r.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(r.id) ? r.id : newId()));
  const weeks = Object.entries(isPlain(d.weeks) ? d.weeks : {})
    .filter(([k]) => /^\d{4}-\d{2}-\d{2}$/.test(k)).map(([k, w]) => [k, normWeek(w, k)]);
  recipes.forEach(r => S.recipes.set(r.id, r));
  weeks.forEach(([k, w]) => { S.weeks[k] = w; });
  if (S.mode === 'firebase') {
    const writes = [...recipes.map(r => { const { id, ...rest } = r; return ['recettes', id, rest]; }), ...weeks.map(([k, w]) => ['semaines', k, w])];
    for (let i = 0; i < writes.length; i += 400) {
      const b = FB.fs.writeBatch(FB.db);
      writes.slice(i, i + 400).forEach(([col, id, data]) => b.set(FB.fs.doc(FB.db, col, id), toFs(data), { merge: true }));
      b.commit().catch(onWriteError);
    }
  } else localSave();
  refresh();
  return recipes.length;
}
async function doImport(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast('Ce fichier n’est pas un export valide'); return; }
  const n = importData(isPlain(d) ? d : {});
  closeSheet(); toast(`${plural(n, 'recette')} importée${n > 1 ? 's' : ''}`);
}
function transferLocal() {
  const n = importData(localLoad());
  try { localStorage.setItem(LKEY_DONE, todayIso()); } catch (e) {}
  closeSheet(); toast(`${plural(n, 'recette')} envoyée${n > 1 ? 's' : ''} dans la base commune`);
}

function plainShop() {
  const w = week();
  return [...shoppingList().filter(i => !w.checked[i.key]).map(i => `- ${i.name}${i.qty != null ? ' : ' + fmtQty(i.qty, i.unit) : ''}`),
    ...extrasOf(w).filter(e => !e.done).map(e => `- ${e.t}`)].join('\n');
}

/* ---------- events ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

function togglePick(id) {
  if (isPicked(id)) patchWeek({ picks: removeVals(id), done: { [id]: DEL }, mult: { [id]: DEL } });
  else patchWeek({ picks: union(id) });
}
/* Semaines passées : chaque recette prévue une semaine terminée compte comme faite cette semaine-là
   (date du lundi). On mémorise sur l’appareil la dernière semaine traitée pour ne pas tout refaire. */
const BKEY = 'mes-recettes:bilan';
let bilanRunning = false;
async function bilanSemaines() {
  if (!ready() || bilanRunning || !S.recipes.size) return;
  const lastWeek = iso(addDays(parseIso(thisWeekKey()), -7));
  let since = '';
  try { since = localStorage.getItem(BKEY) || ''; } catch (e) {}
  if (since >= lastWeek) return;
  bilanRunning = true;
  try {
    let weeks, complete = true;
    if (S.mode === 'firebase') {
      const snap = await FB.fs.getDocs(FB.fs.collection(FB.db, 'semaines'));
      complete = !(snap.metadata && snap.metadata.fromCache);
      weeks = snap.docs.map(d => [d.id, normWeek(d.data(), d.id)]);
    } else weeks = Object.entries(S.weeks);
    const touched = new Set();
    weeks.filter(([k]) => /^\d{4}-\d{2}-\d{2}$/.test(k) && k > since && k <= lastWeek).forEach(([k, w]) => {
      w.picks.forEach(id => {
        const r = S.recipes.get(id);
        if (r && !r.history.includes(k)) { patchRecipe(id, { history: union(k) }); touched.add(id); }
      });
    });
    if (complete) try { localStorage.setItem(BKEY, lastWeek); } catch (e) {}
    if (touched.size) toast(`Dates de dernière réalisation mises à jour (${plural(touched.size, 'recette')})`);
  } catch (e) { console.warn('Bilan des semaines passées impossible', e); }
  finally { bilanRunning = false; }
}

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
  const chip = e.target.closest('[data-filter]');
  if (chip) {
    const f = S.filters, raw = chip.dataset.filter, k = raw.slice(0, raw.indexOf(':')), v = raw.slice(raw.indexOf(':') + 1);
    const set = { season: f.seasons, moment: f.moments, regime: f.regimes, cuisson: f.cuissons, cat: f.categories }[k];
    if (set) set.has(v) ? set.delete(v) : set.add(v);
    renderFilters();
    return;
  }
  const tog = e.target.closest('[data-toggle]');
  if (tog) {
    if (tog.dataset.toggle === 'regime') tog.parentElement.querySelectorAll('[data-toggle]').forEach(b => b.setAttribute('aria-pressed', b === tog));
    else tog.setAttribute('aria-pressed', tog.getAttribute('aria-pressed') !== 'true');
    return;
  }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const { action, id } = a.dataset;
  const w = week();
  switch (action) {
    case 'signin': signIn(); break;
    case 'signout': signOutNow(); break;
    case 'reload': location.reload(); break;
    case 'close': closeSheet(); break;
    case 'data': openData(); break;
    case 'export': doExport(); break;
    case 'import': $('#importFile').click(); break;
    case 'transfer': transferLocal(); break;
    case 'new': openEditor(null); break;
    case 'examples': loadExamples(); break;
    case 'gotorecettes': setTab('recettes'); break;
    case 'gotocourses': setTab('courses'); break;
    case 'clearfilters': Object.assign(S.filters, { q: '', seasons: new Set(), moments: new Set(), regimes: new Set(), cuissons: new Set(), categories: new Set() }); render(); break;
    case 'open': openRecipe(id); break;
    case 'edit': openEditor(id); break;
    case 'save': submitEditor(id || null); break;
    case 'delete': {
      const r = S.recipes.get(id);
      if (r && confirm(`Supprimer « ${r.name} » ?`)) { removeRecipe(id); closeSheet(); toast('Recette supprimée'); }
      break;
    }
    case 'pick': {
      const was = isPicked(id); togglePick(id);
      if (sheetRecipe === id) openRecipe(id);
      if (!was && S.tab === 'recettes') toast(`Ajoutée, ${plural(week().picks.length, 'recette')} cette semaine`);
      break;
    }
    case 'double': patchWeek({ mult: { [id]: w.mult[id] === 2 ? DEL : 2 } }); break;
    case 'itemdetail': {
      const k = a.dataset.key;
      S.openItems.has(k) ? S.openItems.delete(k) : S.openItems.add(k);
      renderShop(); break;
    }
    case 'prevweek': case 'nextweek': case 'thisweek':
      S.weekKey = action === 'thisweek' ? thisWeekKey() : iso(addDays(parseIso(S.weekKey), action === 'prevweek' ? -7 : 7));
      subscribeWeek(); refresh(); break;
    case 'rmextra': patchWeek({ extras: { [id]: DEL } }); break;
    case 'uncheck': {
      const p = { checked: {}, extras: {} };
      Object.keys(w.checked).forEach(k => { p.checked[k] = DEL; });
      Object.entries(w.extras).forEach(([k, x]) => { if (x.done) p.extras[k] = { done: false }; });
      patchWeek(p); break;
    }
    case 'copyshop': {
      const txt = plainShop();
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Liste copiée'), () => toast('Copie impossible ici'));
      break;
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.action === 'tick') patchWeek({ checked: { [t.dataset.key]: t.checked ? true : DEL } });
  if (t.dataset.action === 'tickextra') patchWeek({ extras: { [t.dataset.id]: { done: t.checked } } });
  if (t.hasAttribute('data-sort')) { S.filters.sort = t.value; renderRecipeList(); }
  if (t.hasAttribute('data-addcat') && t.value) { S.filters.categories.add(t.value); renderFilters(); }
  if (t.name === 'category' && t.value === '__new') {
    const name = (prompt('Nom de la nouvelle catégorie') || '').trim().replace(/\s+/g, ' ');
    if (!name) { t.value = ''; return; }
    const existing = [...t.options].find(o => o.value !== '__new' && norm(o.value) === norm(name));
    if (existing) { t.value = existing.value; return; }
    const label = name.charAt(0).toUpperCase() + name.slice(1);
    const opt = new Option(label, label);
    t.add(opt, t.options[t.options.length - 1]); t.value = label;
  }
  if (t.id === 'importFile' && t.files[0]) { doImport(t.files[0]); t.value = ''; }
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.more')) S.moreOpen = e.target.open; }, true);
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.filters.q = e.target.value; renderRecipeList(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'addExtra') {
    const inp = $('#extra'), v = inp.value.trim(); if (!v) return;
    patchWeek({ extras: { [newId()]: { t: v, done: false, at: Date.now() } } });
    inp.value = ''; inp.focus();
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== S.tab && ['semaine', 'recettes', 'courses'].includes(h)) setTab(h); });

init();
})();
</script>
